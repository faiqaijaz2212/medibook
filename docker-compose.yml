version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data
      - ./uploads:/workspace/uploads
    environment:
      - DATABASE_URL=sqlite:///data/medibook.db
      - APP_NAME=MediBook API
      - APP_VERSION=1.0.0
      - SECRET_KEY=9a7c646b96db8e99ab3dfc82fa023e32e8c25db3276cd820bf3fb2e3dcd14d5d
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: always
